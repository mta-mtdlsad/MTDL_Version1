<!DOCTYPE html>

<html>
<head>
    <title>Filter Tracks</title>
</head>
<body>
<h2>Search and Filter Tracks</h2>
<form method="get" action="tracks/filter">
    <!-- Source ID -->
    <label>Source ID:</label>
    <input type="text" name="sourceId" pattern="[A-Za-z0-9_-]{2,30}"><br><br>
    <!--Track Number -->
    <label>Track Number:</label>
    <input type="text" name="trackNumber">
    <br><br>
    <!-- Identity -->
    <label>Track Identity:</label>
    <select name="identity">
        <option selected value=""> -- None -- </option>
        <option value="FRIEND">FRIEND</option>
        <option value="HOSTILE">HOSTILE</option>
        <option value="NEUTRAL">NEUTRAL</option>
        <option value="UNKNOWN">UNKNOWN</option>
    </select>
    <br><br>
    <!-- Status -->
    <label>Track Status:</label>
    <select name="status">
        <option selected value=""> -- None -- </option>
        <option value="ACTIVE">ACTIVE</option>
        <option value="INACTIVE">INACTIVE</option>
    </select>
    <br><br>
    <!-- Speed -->
    <label>Minimum Speed:</label>
    <input type="number" name="minSpeed" min="0" step="any"><br><br>
    <label>Maximum Speed:</label>
    <input type="number" name="maxSpeed" min="0" step="any">
    <br><br>
    <!-- Observation Time -->
    <label>Start Observation Time:</label>
    <input type="datetime-local" name="startTime" id="startTime">
    <br><br>
    <label>End Observation Time:</label>
    <input type="datetime-local" name="endTime" id="endTime">
    <br><br>
    <!-- Observation Type -->
    <label>Observation Type:</label>
    <select name="observationType" id="observationType">
        <option selected value=""> -- None -- </option>
        <option value="current">Current Only</option>
        <option value="stale">Stale Only</option>
    </select>
    <br><br>
    <label>Sort By:</label>
    <br><br>
    <label>
        <input type="checkbox" name="timeSort" value="timeSort">
        Observation Time
    </label>
    <select name="timeSortDirection">
        <option value="DESC">Descending</option>
        <option value="ASC">Ascending</option>
    </select>
    <br><br>
    <label>
        <input type="checkbox" name="speedSort" value="speedSort">
        Speed
    </label>
    <select name="speedSortDirection">
        <option value="DESC">Descending</option>
        <option value="ASC">Ascending</option>
    </select>
    <br><br>
    <label>
        <input type="checkbox" name="trackNumberSort" value="trackNumberSort">
        Track Number
    </label>
    <select name="trackNumberSortDirection">
        <option value="DESC">Descending</option>
        <option value="ASC">Ascending</option>
    </select>
    <br><br>
    <input type="submit" value="Search Tracks">
</form>
</body>
<script>
    const observationType = document.getElementById('observationType');
    const startTime = document.getElementById('startTime');
    const endTime = document.getElementById('endTime');

    observationType.addEventListener('change', function() {
        if (this.value === "") {
            startTime.disabled = false;
            endTime.disabled = false;
        } else {
            startTime.disabled = true;
            endTime.disabled = true;
            startTime.value = '';
            endTime.value = '';
        }
    })
</script>
</html>
