<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EDGE | Track Form</title>
</head>
<body>
<div class="">
    <h3>Track Form</h3>
    <form method="post" action="saveTrack">
        <input type="text" name="trackNumber" placeholder="Enter Track Number" required><br><br>
        <input type="number" name="trackLatitude" placeholder="Enter Track Latitude" required><br><br>
        <input type="number" name="trackLongitude" placeholder="Enter Track Longitude" required><br><br>
        <input type="number" name="trackSpeed" placeholder="Enter Track Speed" required><br><br>
        <input type="text" name="trackIdentity" placeholder="Enter Track Identity" required><br><br>
        <input type="text" name="trackStatus" placeholder="Enter Track Status" required><br><br>
        <input type="date" name="trackCreatedTime" placeholder="Enter Track Created Time" required><br><br>
        <input type="submit">
    </form>
</div>
</body>
</html>
