<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EDGE | Track Form</title>
</head>
<body>
<div class="">
    <h3>Track Form</h3>
    <form method="post" action="tracks/create">
        <label>Enter Track Number</label>
        <input type="text" name="trackNumber" required><br><br>
        <label>Enter Track Latitude</label>
        <input type="number" name="trackLatitude" required><br><br>
        <label>Enter Track Longitude</label>
        <input type="number" name="trackLongitude" required><br><br>
        <label>Enter Track Speed</label>
        <input type="number" name="trackSpeed" required><br><br>
        <label>Enter Track Identity Type</label>
        <select name="trackIdentity" required>
            <option value="FRIEND">FRIEND</option>
            <option value="HOSTILE">HOSTILE</option>
            <option value="NEUTRAL">NEUTRAL</option>
            <option value="UNKNOWN" selected>UNKNOWN</option>
        </select><br><br>
        <label>Enter Track Status</label>
        <select name="trackStatus" required>
            <option value="ACTIVE" selected>ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
        </select><br><br>
        <label>Enter Track Created Time</label>
        <input type="datetime-local" name="trackCreatedTime" required><br><br>
        <input type="submit">
    </form><br><br>
    <form method="get" action="statistics">
        <input type="hidden" name="purpose" value="statistics">
        <input type="submit" value="Get Statistics">
    </form>
</div>
</body>
</html>
