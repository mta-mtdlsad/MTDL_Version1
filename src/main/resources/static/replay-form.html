<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EDGE | Replay Form</title>
</head>
<body>
<div>
    <h3>Replay Time Frame</h3>
    <form id="replayForm">
        <label>Replay Speed:</label>
        <select name="speed" id="speed">
            <option value="HALF">Half Speed (2 seconds)</option>
            <option value="NORMAL">Normal Speed (1 second)</option>
            <option value="DOUBLE">Double Speed (0.5 second)</option>
        </select><br><br>
        <label>Start Date:</label>
        <input type="datetime-local" name="startTime" required><br><br>
        <label>End Date:</label>
        <input type="datetime-local" name="endTime" required><br><br>
        <input type="submit" value="Start Replay">
    </form>
    <h3>Results</h3>
    <pre id="results"></pre>
</div>

<script>
    let eventSource = null;
    document.getElementById("replayForm").addEventListener("submit", function(event) {
        event.preventDefault();
        const results = document.getElementById("results");
        const submitButton = this.querySelector('[type="submit"]');
        if (eventSource) eventSource.close();
        results.textContent = "Replaying tracks...\n";
        submitButton.disabled = true;
        const params = new URLSearchParams(new FormData(this));
        eventSource = new EventSource("/api/tracks/replay/stream?" + params.toString());
        let count = 0;
        eventSource.addEventListener("track", function(event) {
            const track = JSON.parse(event.data);
            if (count === 0) results.textContent = "";
            count++;
            results.textContent += "Source: " + track.sourceId +
                " | Track: " + track.trackNumber +
                " | Sequence: " + track.sequenceNumber +
                " | Time: " + track.createdTime + "\n";
        });
        eventSource.addEventListener("done", function(event) {
            if (count === 0) results.textContent = "No tracks found.\n";
            results.textContent += "\nReplay finished. Total tracks: " + count;
            eventSource.close();
            submitButton.disabled = false;
        });
        eventSource.onerror = function() {
            results.textContent += "\nReplay connection failed or ended unexpectedly.";
            eventSource.close();
            submitButton.disabled = false;
        };
    });
</script>
</body>
</html>
