<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Simulation Control & Generated Data</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-start { background-color: #28a745; color: white; padding: 10px 20px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; }
        .btn-stop { background-color: #dc3545; color: white; padding: 10px 20px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; }
        .btn-view { background-color: #0056b3; color: white; padding: 10px 20px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; margin-left: 10px; }
        .status-box { margin-bottom: 20px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
<h1>Live Simulation Control & Telemetry</h1>
<hr>

<div class="status-box">
    Current Simulation State: <span id="simState" style="color: #0056b3;">Loading...</span>
</div>

<p>
    <button class="btn-start" onclick="controlSimulation('START')">Start Simulation</button>
    <button class="btn-stop" onclick="controlSimulation('STOP')">Stop Simulation</button>
    <button class="btn-view" onclick="loadGeneratedData()">View Generated Data</button>
</p>

<hr>
<h2>Generated Tracking Records Table</h2>
<div id="tableContainer">Click "View Generated Data" or start the simulation to review telemetry output.</div>

<script>
    window.addEventListener('DOMContentLoaded', function() {
        fetchSimulationState();
    });

    function fetchSimulationState() {
        fetch('api/simulation/state')
            .then(response => response.json())
            .then(data => {
                document.getElementById('simState').textContent = data.simulationState ?? 'UNKNOWN';
            })
            .catch(error => {
                document.getElementById('simState').textContent = 'Error fetching state';
            });
    }

    function controlSimulation(action) {
        fetch(`api/simulation/control?action=${action}`, { method: 'POST' })
            .then(response => response.text())
            .then(msg => {
                // Popup alert removed as requested; state and data refresh silently
                fetchSimulationState();
                loadGeneratedData();
            })
            .catch(error => {
                console.error(`Error controlling simulation: ${error}`);
            });
    }

    function loadGeneratedData() {
        document.getElementById('tableContainer').innerHTML = 'Loading generated records...';
        fetch('api/tracks/list')
            .then(response => response.json())
            .then(data => renderTable(data))
            .catch(error => {
                document.getElementById('tableContainer').innerHTML = `<p style="color:red;">Error loading generated tracks: ${error}</p>`;
            });
    }

    function renderTable(tracks) {
        const container = document.getElementById('tableContainer');
        if (!tracks || tracks.length === 0) {
            container.innerHTML = '<p>No generated tracking records available in datastore.</p>';
            return;
        }

        // Sort records in descending order so newest records appear at the top
        /*tracks.sort((a, b) => {
            const timeA = a.createdTime ? new Date(a.createdTime).getTime() : 0;
            const timeB = b.createdTime ? new Date(b.createdTime).getTime() : 0;
            if (timeA !== timeB) {
                return timeB - timeA;
            }
            return (b.trackId || 0) - (a.trackId || 0);
        });*/

        let html = `<table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Source ID</th>
                    <th>Sequence Number</th>
                    <th>Path ID</th>
                    <th>Track Number</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Speed</th>
                    <th>Identity</th>
                    <th>Status</th>
                    <th>Created Time</th>
                </tr>
            </thead>
            <tbody>`;

        tracks.forEach(t => {
            html += `<tr>
                <td>${t.trackId}</td>
                <td>${t.sourceId || 'LEGACY'}</td>
                <td>${t.sequenceNumber ?? 'N/A'}</td>
                <td>${t.pathId ?? '-'}</td>
                <td>${t.trackNumber || ''}</td>
                <td>${t.latitude}</td>
                <td>${t.longitude}</td>
                <td>${t.speed}</td>
                <td>${t.identityType || ''}</td>
                <td>${t.trackStatus || ''}</td>
                <td>${t.createdTime || ''}</td>
            </tr>`;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }
</script>

<hr>
<p><a href="index.html">Return Home</a></p>
</body>
</html>
