<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Track</title>
</head>
<body>

<h1>Search Track</h1>

<form id="searchForm" method="GET">
    <label>Track Number:</label>
    <input type="text" name="track_number" id="track_number"required>
    <button type="submit">Search</button>
</form>
<script>
    document.getElementById("searchForm").addEventListener("submit", function (event){
        event.preventDefault();
        const trackNumber = document.getElementById("track_number").value;
        const api = "/api/tracks/search?track_number=" +encodeURIComponent(trackNumber);
        window.location.href = "/results.html?api=" +encodeURIComponent(api);
    });
</script>
<p><a href="index.html">Return Home</a></p>
</body>
</html>
