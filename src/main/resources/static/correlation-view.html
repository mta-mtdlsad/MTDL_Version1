<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Multi-Source Track Correlations</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .group-card {
            border: 1px solid #bbb;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 24px;
            background-color: #fafafa;
        }
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
        .group-header h3 { margin: 0; color: #222; }
        .badge {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: bold;
        }
        table { border-collapse: collapse; width: 100%; background-color: #fff; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<h1>Multi-Source Track Correlation Groups</h1>
<hr>
<p>Groups tracks reported by different sources within <strong>2.0 km</strong> and <strong>30 seconds</strong> of each other.</p>

<div id="groupsContainer">Analyzing cross-source correlations...</div>

<script>
    window.addEventListener('DOMContentLoaded', function() {
        fetch('/api/analytics/correlations')
            .then(async response => {
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || `HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(groups => renderGroups(groups))
            .catch(error => {
                document.getElementById('groupsContainer').innerHTML =
                    `<p style="color:red;">Error loading correlation groups: ${error.message}</p>`;
            });
    });

    function renderGroups(groups) {
        const container = document.getElementById('groupsContainer');
        if (!groups || groups.length === 0) {
            container.innerHTML = '<p>No correlated multi-source track groups detected in the database.</p>';
            return;
        }

        let html = '';
        groups.forEach(group => {
            html += `
            <div class="group-card">
                <div class="group-header">
                    <h3>Correlation Group #${group.groupId}</h3>
                    <div>
                        <span class="badge">${group.sourceCount} Correlated Tracks</span>
                        <span class="badge">Spread: ≤ ${group.maxDistanceKm} km</span>
                        <span class="badge">Time Window: ≤ ${group.maxTimeDiffSec}s</span>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Track ID</th>
                            <th>Source ID</th>
                            <th>Sequence</th>
                            <th>Track Number</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                            <th>Speed</th>
                            <th>Identity</th>
                            <th>Status</th>
                            <th>Created Time</th>
                        </tr>
                    </thead>
                    <tbody>`;

            group.tracks.forEach(t => {
                html += `<tr>
                    <td>${t.trackId}</td>
                    <td><strong>${t.sourceId || 'N/A'}</strong></td>
                    <td>${t.sequenceNumber ?? 'N/A'}</td>
                    <td>${t.trackNumber || ''}</td>
                    <td>${t.latitude}</td>
                    <td>${t.longitude}</td>
                    <td>${t.speed}</td>
                    <td>${t.identityType || ''}</td>
                    <td>${t.trackStatus || ''}</td>
                    <td>${t.createdTime || ''}</td>
                </tr>`;
            });

            html += `</tbody></table></div>`;
        });

        container.innerHTML = html;
    }
</script>

<hr>
<p><a href="/index.html">Return Home</a></p>
</body>
</html>
