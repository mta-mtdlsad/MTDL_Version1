<!-- Delete a track -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HomePage | Delete Track Form</title>
</head>
<body>

<h3>Delete Track</h3>

<form action="api/tracks/maintenance" method="post">

  <label>Delete Track:
    <input type="text"
           name="trackNumber"
           placeholder="Enter Track Number:"
           required
           minlength="5" />
  </label>

  <br><br>

  <button type="submit">Delete Track</button>
</form>
<br>
<a href="index.html">Return Home</a>
</body>
</html>
