<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>All Registered Tracks</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<h1>All Registered Tracks</h1>
<hr>

<h2>Registered Tracks Table</h2>
<div id="tableContainer">Loading registered tracks...</div>

<script>
    window.addEventListener('DOMContentLoaded', function() {
        fetch('api/tracks/list')
            .then(response => response.json())
            .then(data => renderTable(data))
            .catch(error => {
                document.getElementById('tableContainer').innerHTML = `<p style="color:red;">Error loading tracks: ${error}</p>`;
            });
    });

    function renderTable(tracks) {
        const container = document.getElementById('tableContainer');
        if (!tracks || tracks.length === 0) {
            container.innerHTML = '<p>No Tracks available.</p>';
            return;
        }
        tracks.sort((a, b) => {
            const timeA = a.createdTime ? new Date(a.createdTime).getTime() : 0;
            const timeB = b.createdTime ? new Date(b.createdTime).getTime() : 0;
            if (timeA !== timeB) {
                return timeB - timeA; // Newest time first
            }
            return (b.trackId || 0) - (a.trackId || 0); // Highest ID first
        });

        let html = `<table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Source ID</th>
                    <th>Sequence Number</th>
                    <th>Path ID</th>
                    <th>Track Number</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Speed</th>
                    <th>Identity</th>
                    <th>Status</th>
                    <th>Created Time</th>
                </tr>
            </thead>
            <tbody>`;

        tracks.forEach(t => {
            html += `<tr>
                <td>${t.trackId}</td>
                <td>${t.sourceId || 'LEGACY'}</td>
                <td>${t.sequenceNumber ?? 'N/A'}</td>
                <td>${t.pathId ?? '-'}</td>
                <td>${t.trackNumber || ''}</td>
                <td>${t.latitude}</td>
                <td>${t.longitude}</td>
                <td>${t.speed}</td>
                <td>${t.identityType || ''}</td>
                <td>${t.trackStatus || ''}</td>
                <td>${t.createdTime || ''}</td>
            </tr>`;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }
</script>

<hr>
<p><a href="index.html">Return Home</a></p>
</body>
</html>
