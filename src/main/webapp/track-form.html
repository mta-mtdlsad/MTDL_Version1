<!--//Form to create a track-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> HomePage | Create Track Forms </title>
</head>
<body>


<h3>Create New Track</h3>
<form  action="tracks/create" method="post">

    <label> Enter Source ID:
        <input type="text"
               name="sourceId"
               placeholder="Enter Source Id: "/>

    </label><br><br>


    <label> Enter Track Number:
        <input type="text"
               name="trackNumber"
               placeholder="Enter Track Number: "
               required minlength="5"/>

    </label><br><br>

    <label> Enter sequence Number:
        <input type="text"
               name="sequenceNumber"
               placeholder="Enter sequence Number: "/>

    </label><br><br>

    <label for="end">Enter Observation Date & Time: </label>
    <input type="datetime-local"
           name="observationTime"
           id="end"
           required>
    </label><br><br>


    <label> Enter Latitude:
        <input type="text"
               name="latitude"
               placeholder="Enter Latitude: "/>
    </label><br><br>

    <label> Enter Longitude:
        <input type="text"
               name="longitude"
               placeholder="Enter Longitude: "/>
    </label><br><br>

    <label> Enter Speed:
        <input type="text"
               name="speedNumber"
               placeholder="Enter Speed: "/>
    </label><br><br>

    <label for="identity">Choose Identity Type: </label>
    <select name="identity" id="identity" required>
        <option value="FRIEND">FRIEND</option>
        <option value="NEUTRAL">NEUTRAL</option>
        <option value="HOSTILE">HOSTILE</option>
        <option value="UNKNOWN">UNKNOWN</option>
    </select>
    <br><br>

    <label for="status">Choose Status Type: </label>
    <select name="status" id="status" required>
        <option value="ACTIVE">ACTIVE</option>
        <option value="INACTIVE">INACTIVE</option>
    </select>
    <br><br>

    <button type="submit"> Create Track </button>


</form>
<br>
<a href="index.html">Return Home</a>

</body>

</html>
