<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> HomePage | Filter Track Form</title>
</head>
<body>

<h3>Filter Tracks</h3>

<form action="tracks/filter" method="get">

  <label for="identity">Choose Identity Type:</label>
  <select name="identity" id="identity">
    <option value="default"></option>
    <option value="FRIEND">FRIEND</option>
    <option value="NEUTRAL">NEUTRAL</option>
    <option value="HOSTILE">HOSTILE</option>
    <option value="UNKNOWN">UNKNOWN</option>
  </select>     <button type="submit">Submit</button>


  <br><br>

  <label for="status">Choose Status Type:</label>
  <select name="status" id="status">
    <option value="default"></option>
    <option value="ACTIVE">ACTIVE</option>
    <option value="INACTIVE">INACTIVE</option>
  </select>
  <button type="submit">Search Track</button>

  <br><br>

  <label for="minimumSpeed">Minimum Speed:</label>
  <input type="number" name="minimumSpeed"
         id="minimumSpeed" min="0" step="any" value="0"
  >     <button type="submit">Search Track</button>


  <br><br>


</form>
<br>
<a href="index.html">Return Home</a>

</body>
</html>
