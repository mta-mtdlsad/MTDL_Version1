services:
  db:
    image: postgres:16-alpine
    container_name: mtdl-sad-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-MTDL_SAD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtdl-sad-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-MTDL_SAD}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:123}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "5000:5000/udp"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtdl-sad-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
