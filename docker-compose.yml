services:

  # PostgreSQL Database
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: MTDL_SAD
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d MTDL_SAD" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090/udp"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/MTDL_SAD
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

# Persistent Database Storage
volumes:
  postgres_data: